[package]
name = "rs2mermaid"
version = "1.0.0"
edition = "2021"
authors = ["AIVA Team"]
description = "Rust AST 解析與 Mermaid 流程圖產生工具"

[[bin]]
name = "rs2mermaid"
path = "rs2mermaid.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
