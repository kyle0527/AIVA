[package]
name = "crypto-scanner"
version = "2.0.0"
edition = "2021"
authors = ["AIVA Team"]
description = "Network-based cryptography configuration scanner for blackbox testing"
license = "MIT"

[[bin]]
name = "crypto-scanner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
tokio = { version = "1.35", features = ["full"] }
rustls = "0.23"
webpki-roots = "0.26"
tokio-rustls = "0.26"
x509-parser = "0.16"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
