# AIVA 能力註冊中心配置檔案
# 此檔案定義了系統的核心配置參數

# 系統基本資訊
name: "AIVA Capability Registry"
version: "1.0.0"
environment: "development"  # development, staging, production

# 資料庫配置
database:
  path: "data/capability_registry.db"
  backup_enabled: true
  backup_interval_hours: 24
  max_backups: 7

# 能力發現配置
discovery:
  auto_discovery_enabled: true
  discovery_interval_minutes: 60
  scan_directories:
    - "services/features"
    - "services/scan"
    - "services/analysis"
    - "tools"
  exclude_patterns:
    - "__pycache__"
    - "*.pyc"
    - ".git"
    - "node_modules"
    - "target/debug"
    - "*.log"

# 監控配置
monitoring:
  health_check_enabled: true
  health_check_interval_minutes: 15
  performance_monitoring_enabled: true
  alert_thresholds:
    max_latency_ms: 5000
    min_success_rate: 95.0
    max_error_rate: 5.0

# API 配置
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  docs_enabled: true
  cors_enabled: true
  rate_limit_enabled: true
  max_requests_per_minute: 100

# 日誌配置
logging:
  level: "INFO"
  format: "structured"
  output_file: "logs/capability_registry.log"
  rotate_enabled: true
  max_file_size_mb: 100
  max_files: 10

# 安全配置
security:
  authentication_enabled: false
  api_key_required: false
  allowed_origins:
    - "*"
  ssl_enabled: false
  ssl_cert_path: null
  ssl_key_path: null

# AIVA 整合配置
aiva_common_path: "services/aiva_common"
tools_enabled:
  - "schema_validator"
  - "schema_codegen_tool"
  - "module_connectivity_tester"

# 支援的程式語言
supported_languages:
  - "python"
  - "go"
  - "rust"
  - "typescript"

# ===== 新增功能模組能力註冊 =====
# 以下為 7 個新整合的 HackingTool 功能模組
# 注意: wireless_attack 模組已移除（移至技術儲備）

capabilities:
  # 1. 字典生成器模組
  - id: "wordlist_generator"
    name: "Wordlist Generator"
    module_path: "services.features.function_wordlist_generator"
    manager_class: "WordlistGeneratorManager"
    version: "1.0.0"
    risk_level: "L1"  # LOW
    category: "utility"
    enabled: true
    requires_authorization: false
    tags: ["wordlist", "password", "dictionary", "brute_force", "cupp"]
    capabilities:
      - "combination_generation"
      - "cupp_profile_generation"
      - "wordlist_merge"
      - "wordlist_analysis"
    required_tools: ["cupp"]
    metadata:
      tools: ["cupp"]
      strategies: ["combination", "profile", "rule_based", "hybrid"]
      max_words: 10000000

  # 2. 數位鑑識模組
  - id: "forensic"
    name: "Digital Forensic Tools"
    module_path: "services.features.function_forensic"
    manager_class: "ForensicManager"
    version: "1.0.0"
    risk_level: "L1"  # LOW
    category: "analysis"
    enabled: true
    requires_authorization: false
    tags: ["forensic", "evidence", "analysis", "timeline", "autopsy"]
    capabilities:
      - "case_management"
      - "evidence_acquisition"
      - "disk_image_analysis"
      - "memory_dump_analysis"
      - "timeline_generation"
    required_tools: ["autopsy", "volatility", "bulk_extractor"]
    metadata:
      tools: ["autopsy", "volatility", "bulk_extractor"]
      supported_formats: ["raw", "E01", "AFF", "vmdk"]
      analysis_types: ["disk", "memory", "network", "file_carving"]

  # 4. 隱寫術模組
  - id: "steganography"
    name: "Steganography Tools"
    module_path: "services.features.function_steganography"
    manager_class: "SteganographyManager"
    version: "1.0.0"
    risk_level: "L1"  # MEDIUM
    category: "utility"
    enabled: true
    requires_authorization: false
    tags: ["steganography", "hiding", "extraction", "detection", "steghide"]
    capabilities:
      - "steganography_detect"
      - "steganography_extract"
      - "data_embed"
      - "data_extract"
      - "hidden_data_detection"
      - "capacity_calculation"
    required_tools: ["steghide", "stegcracker", "stegdetect"]
    metadata:
      tools: ["steghide", "stegcracker"]
      supported_carriers: ["image", "audio", "video", "text"]
      methods: ["LSB", "DCT", "DWT", "spread_spectrum"]

  # 4. 漏洞利用框架模組
  - id: "exploit_framework"
    name: "Exploit Framework"
    module_path: "services.features.function_exploit_framework"
    manager_class: "ExploitFrameworkManager"
    version: "1.0.0"
    risk_level: "L2"  # CRITICAL
    category: "attack"
    enabled: true
    requires_authorization: true
    tags: ["exploit", "vulnerability", "metasploit", "attack", "routersploit"]
    capabilities:
      - "exploit_search"
      - "exploit_execution"
      - "vulnerability_scan"
      - "vulnerability_verification"
    required_tools: ["metasploit", "routersploit", "commix"]
    metadata:
      tools: ["metasploit", "routersploit", "commix"]
      exploit_types: ["remote", "local", "web", "network"]
      platforms: ["linux", "windows", "macos", "router", "iot"]

  # 5. 逆向工程模組
  - id: "reverse_engineering"
    name: "Reverse Engineering Tools"
    module_path: "services.features.function_reverse_engineering"
    manager_class: "ReverseEngineeringManager"
    version: "1.0.0"
    risk_level: "L1"  # LOW
    category: "analysis"
    enabled: true
    requires_authorization: false
    tags: ["reverse_engineering", "decompile", "analysis", "apk", "jadx"]
    capabilities:
      - "binary_analysis"
      - "apk_analysis"
      - "apk_decompile"
      - "malware_detection"
      - "string_extraction"
    required_tools: ["jadx", "androguard", "ghidra", "radare2"]
    metadata:
      tools: ["jadx", "androguard"]
      supported_formats: ["APK", "DEX", "ELF", "PE", "Mach-O"]
      analysis_modes: ["static", "dynamic", "hybrid"]

  # 6. Payload 生成器模組
  - id: "payload_generator"
    name: "Payload Generator"
    module_path: "services.features.function_payload_generator"
    manager_class: "PayloadGeneratorManager"
    version: "1.0.0"
    risk_level: "L2"  # CRITICAL
    category: "attack"
    enabled: true
    requires_authorization: true
    tags: ["payload", "shellcode", "msfvenom", "webshell", "meterpreter"]
    capabilities:
      - "reverse_shell_generation"
      - "web_shell_generation"
      - "meterpreter_generation"
      - "poc_generation"
      - "payload_obfuscation"
    required_tools: ["msfvenom", "metasploit"]
    metadata:
      tools: ["msfvenom", "metasploit"]
      languages: ["bash", "python", "powershell", "php", "ruby", "perl", "java", "c"]
      platforms: ["linux", "windows", "macos", "android", "web"]

  # 7. 社交工程模組
  - id: "social_engineering"
    name: "Social Engineering Tools"
    module_path: "services.features.function_social_engineering"
    manager_class: "SocialEngineeringManager"
    version: "1.0.0"
    risk_level: "L2"  # HIGH
    category: "attack"
    enabled: true
    requires_authorization: true
    tags: ["phishing", "social_engineering", "osint", "credential", "setoolkit"]
    capabilities:
      - "phishing_campaign"
      - "credential_harvesting"
      - "osint_collection"
      - "campaign_analytics"
      - "email_spoofing"
    required_tools: ["setoolkit", "gophish", "evilginx2"]
    metadata:
      tools: ["setoolkit", "gophish", "evilginx2"]
      phishing_types: ["email", "spear", "smishing", "vishing"]
      platforms: ["office365", "google", "github", "linkedin"]