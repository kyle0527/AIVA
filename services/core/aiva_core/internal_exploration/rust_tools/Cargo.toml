[package]
name = "rs2mermaid"
version = "2.1.0"
edition = "2021"
description = "Rust AST analyzer with Clap CLI macro support"

[workspace]

[dependencies]
syn = { version = "2.0", features = ["full", "visit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
regex = "1.10"
quote = "1.0"  # For token stream handling
