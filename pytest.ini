[pytest]
# 測試目錄配置
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 輸出配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# 標記定義
markers =
    slow: 標記為慢速測試（執行時間 > 1秒）
    integration: 標記為整合測試（需要外部依賴）
    unit: 標記為單元測試（純邏輯測試）
    asyncio: 標記為異步測試
    skip_ci: 在 CI 環境中跳過的測試

# 覆蓋率配置
[coverage:run]
source = services
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
