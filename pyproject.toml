
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiva-platform"
version = "7.1.0"
description = "AIVA — AI-driven Vulnerability Analysis & Bug Bounty Platform"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
  # Core Framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  # Async & Message Queue
  "aio-pika>=9.4.0",
  "aiohttp>=3.8.0",
  "aiofiles>=23.2.1",
  "httpx>=0.27.0",
  "requests>=2.31.0",
  # Database & Storage
  "sqlalchemy>=2.0.31",
  "asyncpg>=0.29.0",
  "redis>=5.0.0",
  # gRPC
  "grpcio>=1.60.0",
  "protobuf>=4.25.0",
  # Security
  "PyJWT>=2.8.0",
  "cryptography>=42.0.0",
  # Web Scraping
  "beautifulsoup4>=4.12.2",
  "lxml>=5.0.0",
  "dnspython>=2.4.0",
  # CLI & UX
  "click>=8.1.0",
  "rich>=13.0.0",
  # Configuration & Serialization
  "PyYAML>=6.0",
  "jinja2>=3.1.0",
  # Monitoring & Utilities
  "structlog>=24.1.0",
  "psutil>=5.9.6",
  "tenacity>=8.3.0",
]

[project.optional-dependencies]
ai = [
  "torch>=2.1.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "transformers>=4.30.0",
  "networkx>=3.1",
  "plotly>=5.15.0",
  "pandas>=2.0.0",
]
dashboard = [
  "streamlit>=1.28.0",
]
monitoring = ["prometheus-client>=0.20"]
pdf = ["reportlab>=3.6"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "pytest-asyncio>=0.23.0",
  "black>=24.0.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "pre-commit>=3.6.0",
  "types-requests>=2.31.0",
  "grpcio-tools>=1.60.0",
]

[tool.setuptools]
packages = ["services", "services.aiva_common", "services.core", "services.scan", "services.integration", "services.features"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.yml", "*.yaml", "*.md", "*.txt"]

[tool.setuptools.package-dir]
services = "services"
"services.aiva_common" = "services/aiva_common"
"services.core" = "services/core"
"services.scan" = "services/scan"
"services.integration" = "services/integration"
"services.features" = "services/features"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE"]
ignore = ["E501"]                                       # handled by black
fix = true
target-version = "py313"
exclude = [
    "*/external_tools/*",
    "services/features/*/external_tools/*"
]

[tool.ruff.isort]
known-first-party = ["services"]
force-sort-within-sections = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
known_first_party = ["services"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
no_implicit_optional = false
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "^(tests|services[\\/]scan|.*[\\/]external_tools)[\\/]"
disable_error_code = [
    "no-any-return",
    "assignment", 
    "type-arg",
    "valid-type",
    "override",
    "misc",
    "unused-ignore"
]

[[tool.mypy.overrides]]
module = [
    "aio_pika.*",
    "httpx.*",
    "beautifulsoup4.*",
    "lxml.*",
    "redis.*",
    "neo4j.*",
    "reportlab.*",
    "prometheus_client.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
asyncio_mode = "auto"
markers = [
  "asyncio: marks tests as async tests",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "slow: marks tests as slow running",
]

[tool.coverage.run]
source = ["services"]
omit = ["tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
  "raise NotImplementedError",
]
